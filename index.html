<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro Live</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="card header">
        <h2>Controle Financeiro</h2>
        <button class="btn" id="btnAtualizar">🔄 Atualizar Dados</button>
    </div>

    <div id="loading">Carregando dados e montando gráficos... ⏳</div>

    <div class="card" id="areaFiltros" style="display: none;">
        <div class="filtros">
            <div class="filtro-group">
                <label>Ano</label>
                <select id="fAno"><option value="">Todos</option></select>
            </div>
            <div class="filtro-group">
                <label>Mês</label>
                <select id="fMes"><option value="">Todos</option></select>
            </div>
            <div class="filtro-group">
                <label>Tipo</label>
                <select id="fTipo"><option value="">Todos</option></select>
            </div>
            <div class="filtro-group">
                <label>Subtipo</label>
                <select id="fSubtipo"><option value="">Todos</option></select>
            </div>
        </div>
    </div>

    <div class="charts-grid" id="areaGraficos" style="display: none;">
        <div class="card">
            <h3>Balanço: Entradas vs Saídas</h3>
            <div class="chart-container">
                <canvas id="chartFluxo"></canvas>
            </div>
        </div>
        <div class="card">
            <h3>Despesas por Tipo (Saídas)</h3>
            <div class="chart-container">
                <canvas id="chartTipos"></canvas>
            </div>
        </div>
    </div>
</div>

<script type="module" src="./js/main.js"></script>

</body>
</html>
